# Azure DevOps equivalent of .github/workflows/build-postgresql.yml
# Fineract Cargo & Unit- & Integration tests - PostgreSQL
#
# Runs the JUnit unit + integration test suite against PostgreSQL, sharded into
# 5 parallel jobs (test-core-1 .. test-core-5) using scripts/split-tests.sh.

# GitHub: on: [pull_request]
trigger: none

pr:
  branches:
    include:
      - '*'

# GitHub Actions "services:" -> Azure DevOps service containers.
# On Microsoft-hosted agents the job runs on the host, so container ports are
# mapped to localhost (matching the GitHub behaviour).
resources:
  containers:
    - container: postgres
      image: postgres:18.2
      ports:
        - 5432:5432
      env:
        POSTGRES_USER: root
        POSTGRES_PASSWORD: postgres
    - container: mockoauth2
      image: ghcr.io/navikt/mock-oauth2-server:3.0.1
      ports:
        - 9000:9000
      env:
        SERVER_PORT: 9000
        JSON_CONFIG: '{ "interactiveLogin": true, "httpServer": "NettyWrapper", "tokenCallbacks": [ { "issuerId": "auth/realms/fineract", "tokenExpiry": 120, "requestMappings": [{ "requestParam": "scope", "match": "fineract", "claims": { "sub": "mifos", "scope": [ "test" ] } } ] } ] }'

jobs:
  - job: test
    displayName: 'Unit & Integration tests (PostgreSQL)'
    timeoutInMinutes: 60
    pool:
      vmImage: 'ubuntu-24.04'

    # GitHub matrix: task: [test-core-1 .. test-core-5]  (fail-fast: false)
    strategy:
      maxParallel: 5
      matrix:
        test-core-1:
          taskName: test-core-1
        test-core-2:
          taskName: test-core-2
        test-core-3:
          taskName: test-core-3
        test-core-4:
          taskName: test-core-4
        test-core-5:
          taskName: test-core-5

    services:
      postgresql: postgres
      mock-oauth2-server: mockoauth2

    variables:
      TZ: Asia/Kolkata
      AWS_ENDPOINT_URL: http://localhost:4566
      AWS_ACCESS_KEY_ID: localstack
      AWS_SECRET_ACCESS_KEY: localstack
      AWS_REGION: us-east-1
      FINERACT_REPORT_EXPORT_S3_ENABLED: 'true'
      FINERACT_REPORT_EXPORT_S3_BUCKET_NAME: fineract-reports
      FINERACT_DEFAULT_TENANTDB_HOSTNAME: localhost
      FINERACT_DEFAULT_TENANTDB_PORT: '5432'
      FINERACT_DEFAULT_TENANTDB_UID: root
      FINERACT_DEFAULT_TENANTDB_PWD: postgres
      FINERACT_SYNAPSE_ENABLED: 'true'
      FINERACT_SYNAPSE_BASE_URL: http://localhost:18089
      FINERACT_SYNAPSE_API_KEY: 'Basic bWlmb3M6cGFzc3dvcmQ='
      FINERACT_SYNAPSE_FORCE_ENABLED: 'false'

    steps:
      - checkout: self
        fetchDepth: 0
        fetchTags: true

      - task: JavaToolInstaller@0
        displayName: 'Set up JDK 21'
        inputs:
          versionSpec: '21'
          jdkArchitectureOption: 'x64'
          jdkSourceOption: 'PreInstalled'

      - task: Cache@2
        displayName: 'Cache Gradle dependencies'
        inputs:
          key: 'gradle | "$(Agent.OS)" | **/*.gradle*, **/gradle-wrapper.properties'
          restoreKeys: |
            gradle | "$(Agent.OS)"
          path: '$(HOME)/.gradle'

      - bash: |
          while ! pg_isready -d postgres -U root -h 127.0.0.1 -p 5432 ; do
            sleep 1
          done
        displayName: 'Verify PostgreSQL connection'

      - bash: |
          ./gradlew --no-daemon -q createPGDB -PdbName=fineract_tenants
          ./gradlew --no-daemon -q createPGDB -PdbName=fineract_default
        displayName: 'Initialise databases'

      - bash: |
          docker run -d --name localstack -p 4566:4566 -p 4510-4559:4510-4559 localstack/localstack:2.1
          sleep 10
          docker exec localstack awslocal s3api create-bucket --bucket fineract-reports
        displayName: 'Start LocalStack'

      - bash: |
          chmod +x scripts/split-tests.sh
          SHARD_INDEX=$(echo "$(taskName)" | awk -F'-' '{print $3}')
          ./scripts/split-tests.sh 5 $SHARD_INDEX
          cat "shard-tests_${SHARD_INDEX}.txt"
        displayName: 'Generate test class list'

      - bash: |
          set -e
          SHARD_INDEX=$(echo "$(taskName)" | awk -F'-' '{print $3}')
          FAILED=0

          echo "Grouping test classes by module..."
          declare -A module_tests

          while IFS=, read -r module class; do
            module_tests["$module"]+="$class "
          done < "shard-tests_${SHARD_INDEX}.txt"

          for module in "${!module_tests[@]}"; do
            echo "##[group]Running tests in $module"
            for class in ${module_tests[$module]}; do
              echo "  - $class"
            done

            test_args=$(for class in ${module_tests[$module]}; do echo --tests "$class"; done | xargs)

            if ! ./gradlew "$module:test" $test_args -PdbType=postgresql -x checkstyleJmh -x checkstyleMain -x checkstyleTest -x spotlessCheck -x spotlessApply -x spotbugsMain -x spotbugsTest -x javadoc -x javadocJar -x modernizer; then
              echo "##[error]Tests failed in module $module"
              FAILED=1
            fi
            echo "##[endgroup]"
          done

          if [ "$FAILED" -eq 1 ]; then
            echo "##[error]Some tests failed in this job"
            exit 1
          fi
        displayName: 'Run Gradle Task'

      - task: PublishTestResults@2
        displayName: 'Publish JUnit test results'
        condition: always()
        inputs:
          testResultsFormat: 'JUnit'
          testResultsFiles: '**/build/test-results/**/TEST-*.xml'
          testRunTitle: '$(taskName)'
          mergeTestResults: true
          failTaskOnFailedTests: false

      # GitHub upload-artifact path: '**/build/reports/'
      - bash: mkdir -p '$(Build.ArtifactStagingDirectory)/test-results'
        displayName: 'Ensure test-results dir exists'
        condition: always()

      - task: CopyFiles@2
        displayName: 'Collect test reports'
        condition: always()
        inputs:
          sourceFolder: '$(System.DefaultWorkingDirectory)'
          contents: '**/build/reports/**'
          targetFolder: '$(Build.ArtifactStagingDirectory)/test-results'

      - task: PublishPipelineArtifact@1
        displayName: 'Archive test results'
        condition: always()
        continueOnError: true
        inputs:
          targetPath: '$(Build.ArtifactStagingDirectory)/test-results'
          artifact: 'test-results-$(taskName)'

      # GitHub upload-artifact path: '**/build/cargo/'
      # CopyFiles@2 does not create targetFolder when the glob matches nothing,
      # and PublishPipelineArtifact then fails with "Path does not exist".
      # GitHub's upload-artifact only warns on no match, so create the folder
      # up front to keep the same non-fatal behaviour (cargo logs are absent
      # when the server is not started via cargo).
      - bash: mkdir -p '$(Build.ArtifactStagingDirectory)/server-logs'
        displayName: 'Ensure server-logs dir exists'
        condition: always()

      - task: CopyFiles@2
        displayName: 'Collect server logs'
        condition: always()
        inputs:
          sourceFolder: '$(System.DefaultWorkingDirectory)'
          contents: '**/build/cargo/**'
          targetFolder: '$(Build.ArtifactStagingDirectory)/server-logs'

      - task: PublishPipelineArtifact@1
        displayName: 'Archive server logs'
        condition: always()
        continueOnError: true
        inputs:
          targetPath: '$(Build.ArtifactStagingDirectory)/server-logs'
          artifact: 'server-logs-$(taskName)'

name: Fineract Access Dev

on:
  push:
    branches:
      - develop
env:
  ecr_repository: access/backend
  ecr_deploy_role: arn:aws:iam::916148231619:role/fiter-us-east-2-dev-ghdeploy-role-access
  ecr_region: us-east-2

jobs:
  image_to_ecr_dev:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4
        with:
          java-version: '21'
          distribution: 'zulu'
          cache: gradle


      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ecr_deploy_role }}
          aws-region: ${{ env.ecr_region }}

      - name: Get the current commit hash
        id: commit
        run: echo "hash=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Get the short commit hash
        id: short-commit-message
        run: echo "commit_hash=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT


      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ env.ecr_repository }}
          COMMIT_HASH: ${{ steps.short-commit-message.outputs.commit_hash }}

        run: |
          ./gradlew --no-daemon --console=plain :fineract-provider:clean :fineract-provider:build :fineract-provider:jibDockerBuild -x test -x cucumber -x spotlessCheck -x rat -x checkstyleMain
          docker tag fineract:latest $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:latest $ECR_REGISTRY/$ECR_REPOSITORY:$COMMIT_HASH
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$COMMIT_HASH

      - name: Print image tags
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ env.ecr_repository }}
          COMMIT_HASH: ${{ steps.short-commit-message.outputs.commit_hash }}
        run: echo "The image has been pushed to $ECR_REGISTRY/$ECR_REPOSITORY:latest and $ECR_REGISTRY/$ECR_REPOSITORY:$COMMIT_HASH"
